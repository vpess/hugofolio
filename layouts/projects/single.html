{{ define "main" }}
<article class="post">
  <header class="page-head">
    <p class="meta"><a href="{{ .Parent.RelPermalink }}">← projetos</a></p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="muted">{{ . }}</p>{{ end }}
    {{ partial "project-meta.html" . }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
