<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  {{ if not .IsHome }}{{ partial "header.html" . }}{{ end }}
  <main id="main" class="container{{ if .IsHome }} container-wide{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
